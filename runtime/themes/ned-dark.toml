# Ned Dark - Default dark theme with balanced syntax hierarchy matching Helix keys.

"keyword" = { fg = "#f7768e", modifiers = ["bold"] }
"type" = { fg = "#7dcfff" }
"function" = { fg = "#7aa2f7" }
"string" = { fg = "#9ece6a" }
