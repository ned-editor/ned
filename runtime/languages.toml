# Standard runtime language definitions, comment tokens, and language server configurations for Ned.

[[language]]
name = "rust"
scope = "source.rust"
file-types = ["rs"]
comment-token = "//"
language-server = { command = "rust-analyzer", args = [] }

[[language]]
name = "python"
scope = "source.python"
file-types = ["py", "pyi"]
comment-token = "#"
language-server = { command = "pylsp", args = [] }

[[language]]
name = "go"
scope = "source.go"
file-types = ["go"]
comment-token = "//"
language-server = { command = "gopls", args = [] }

[[language]]
name = "c"
scope = "source.c"
file-types = ["c", "h"]
comment-token = "//"
language-server = { command = "clangd", args = [] }

[[language]]
name = "cpp"
scope = "source.cpp"
file-types = ["cpp", "cc", "cxx", "hpp", "hh", "hxx"]
comment-token = "//"
language-server = { command = "clangd", args = [] }

[[language]]
name = "javascript"
scope = "source.js"
file-types = ["js", "mjs", "cjs"]
comment-token = "//"
language-server = { command = "typescript-language-server", args = ["--stdio"] }

[[language]]
name = "typescript"
scope = "source.ts"
file-types = ["ts", "mts", "cts"]
comment-token = "//"
language-server = { command = "typescript-language-server", args = ["--stdio"] }

[[language]]
name = "toml"
scope = "source.toml"
file-types = ["toml"]
comment-token = "#"

[[language]]
name = "json"
scope = "source.json"
file-types = ["json"]

[[language]]
name = "markdown"
scope = "source.md"
file-types = ["md", "markdown"]
comment-token = "<!--"
